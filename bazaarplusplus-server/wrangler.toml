name = "bazaarplusplus-mod-api-v6"
main = "src/index.ts"
compatibility_date = "2026-08-02"
workers_dev = false

[triggers]
# */15 runs D1 retention. The others dispatch GitHub workflows, keyed by
# WORKFLOW_DISPATCHES in src/modules/workflow-dispatch.ts: the analyzer at
# 01:00 and 12:00 UTC, and the QQ daily report at 01:50 UTC so it reaches the
# groups near 10:00 Beijing time (docs/adr/0005-workflow-dispatch.md).
crons = ["*/15 * * * *", "0 1 * * *", "50 1 * * *", "0 12 * * *"]

[placement]
region = "aws:ap-east-1"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1.0

[vars]
R2_ACCOUNT_ID = "ea3913fc761734a6851a53732cbe7701"

[[routes]]
pattern = "mod-api-v6.bazaarplusplus.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "bazaarplusplus-mod-api-v6-db"
database_id = "1ad61742-bfcc-4d0f-8207-adc89f115134"
migrations_dir = "migrations-v6"

[[r2_buckets]]
binding = "BUNDLE_BUCKET"
bucket_name = "bazaarplusplus-bundle-v6"

[[ratelimits]]
name = "GHOST_BATTLE_RATE_LIMITER"
# Unique in the account; 1001 is already taken there.
namespace_id = "1002"

[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "BUNDLE_UPLOAD_RATE_LIMITER"
# Unique in the account, like the Ghost limiter's.
namespace_id = "1003"

[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "ACCOUNT_RATE_LIMITER"
# Unique in the account, like the Ghost and Upload limiters.
namespace_id = "1004"

[ratelimits.simple]
limit = 20
period = 60

[[send_email]]
name = "EMAIL"
