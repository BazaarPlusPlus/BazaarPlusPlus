# Workspace Git hooks. Install with `just hooks-install`.
# Recipes own the gates. Commits run checks only; tests run in CI.
pre-commit:
  parallel: true
  jobs:
    - name: workspace
      glob: '{JUSTFILE,**/*.just,package.json,bun.lock,bunfig.toml,.oxlintrc.json,tsconfig.json,vitest.config.ts,lefthook.yml,VERSION,release/**,scripts/**,.github/scripts/**,.agents/skills/**,design/build.ts}'
      run: just commands-check release::check

    - name: design
      glob: 'design/**'
      run: just design::check

    - name: mod
      glob: '{bazaarplusplus-mod/**,bazaarplusplus-server/contracts/**,bazaarplusplus-analyzer/contracts/**,release/**,VERSION,JUSTFILE}'
      run: just verify mod::check

    - name: installer
      glob: '{bazaarplusplus-installer/**,design/**,tsconfig.json,release/**,VERSION,scripts/**,JUSTFILE}'
      run: just installer::check-fast

    - name: site
      glob: '{bazaarplusplus-site/**,design/**,bazaarplusplus-installer/src/styles/tokens.css,bazaarplusplus-analyzer/contracts/**,release/**,JUSTFILE}'
      run: just site::check

    - name: server
      glob: '{bazaarplusplus-server/**,JUSTFILE}'
      run: just server::check

    - name: analyzer
      glob: '{bazaarplusplus-analyzer/**,bazaarplusplus-server/contracts/**,JUSTFILE}'
      run: just analyzer::check

    - name: android
      glob: '{bazaarplusplus-android/**,design/**,JUSTFILE}'
      run: just android::check
