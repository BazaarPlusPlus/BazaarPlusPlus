# Workspace Git hooks. Install with `just hooks-install`.
# Recipes own the gates. Commits run checks; the only tests they run are the root tooling
# tests that `just commands-check` ends with. Project tests run in CI.
pre-commit:
  parallel: true
  jobs:
    - name: workspace
      glob: '{JUSTFILE,**/*.just,package.json,packages/ui/package.json,bun.lock,bunfig.toml,tsconfig.json,vite.config.ts,vitest.config.ts,lefthook.yml,VERSION,release/**,scripts/**,.github/scripts/**,.agents/skills/**,design/**,packages/runs/**,bazaarplusplus-mod/scripts/**}'
      run: just commands-check runs::check release::check

    - name: design
      glob: '{design/**,packages/ui/styles/**}'
      run: just design::check

    - name: ui
      glob: '{packages/ui/**,design/tokens.json,JUSTFILE}'
      run: just ui::check-fast

    - name: mod
      glob: '{bazaarplusplus-mod/**,bazaarplusplus-server/contracts/**,bazaarplusplus-analyzer/contracts/**,release/**,VERSION,JUSTFILE}'
      run: just verify mod::check

    - name: installer
      glob: '{bazaarplusplus-installer/**,packages/ui/**,packages/runs/**,design/**,tsconfig.json,release/**,VERSION,scripts/**,JUSTFILE}'
      run: just installer::check-fast

    - name: ui-docs
      glob: '{bazaarplusplus-ui-docs/**,packages/ui/**,design/**,JUSTFILE}'
      run: just ui-docs::check
    - name: site
      glob: '{bazaarplusplus-site/**,packages/ui/**,packages/runs/**,design/**,bazaarplusplus-analyzer/contracts/**,release/**,JUSTFILE}'
      run: just site::check

    - name: server
      glob: '{bazaarplusplus-server/**,JUSTFILE}'
      run: just server::check

    - name: analyzer
      glob: '{bazaarplusplus-analyzer/**,bazaarplusplus-server/contracts/**,JUSTFILE}'
      run: just analyzer::check

    - name: android
      glob: '{bazaarplusplus-android/**,design/**,JUSTFILE}'
      run: just android::check
