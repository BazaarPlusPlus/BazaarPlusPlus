[package]
name = "bppinstaller"
version = "5.2.1"
description = "BazaarPlusPlus Desktop App"
authors = ["cauyxy <cauyxy@gmail.com>"]
edition = "2021"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bppinstaller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bppinstaller"
path = "src/main.rs"
# `main` only delegates to the library. Disabling its empty test harness also
# avoids linking the Windows application resources into the same target twice.
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
dirs = "6"
keyvalues-parser = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["cors"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
include_dir = "0.7"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
