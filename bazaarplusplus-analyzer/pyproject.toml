[project]
name = "bazaarlens"
version = "0.3.0"
description = "Single-process analyzer publishing two Analyzer consumer snapshots"
requires-python = "==3.15.*"
dependencies = [
    "boto3==1.43.126",
    "click==8.5.1",
    "duckdb==2.0.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pyarrow==26.0.1",
    "python-dotenv==1.2.4",
]

[project.scripts]
bazaarlens = "bazaarlens.cli:main"

[tool.uv]
required-version = "==0.13.7"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "ty==0.0.99",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaarlens"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/v6/hero-aliases.json" = "bazaarlens/contracts/v6/hero-aliases.json"
"contracts/v6/heroes.schema.json" = "bazaarlens/contracts/v6/heroes.schema.json"
"contracts/v6/builds.schema.json" = "bazaarlens/contracts/v6/builds.schema.json"

[tool.pytest.ini_options]
addopts = [
    "--cov=bazaarlens",
    "--cov-branch",
    "--cov-fail-under=78",
    "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 78
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
source = ["bazaarlens"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
# Progress callbacks defined inside loops run synchronously within the same
# iteration, so late binding of loop variables cannot occur.
ignore = ["B023"]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["src"]
