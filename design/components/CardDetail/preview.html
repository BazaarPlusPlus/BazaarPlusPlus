<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Card detail</title>
    <link
      rel="stylesheet"
      href="../../../bazaarplusplus-installer/src/styles/tokens.css"
    />
    <link rel="stylesheet" href="../bundle.css" />
  </head>
  <body class="bpp-dialog-card">
    <article class="bpp-card-detail">
      <header class="bpp-detail-head">
        <div>
          <div class="bpp-detail-title">
            <h2>Radar Module</h2>
            <span class="bpp-enchant bpp-enchant-icy">Icy</span>
          </div>
          <div class="bpp-detail-tags">
            <span>Small</span>
            <span>Tech</span>
          </div>
        </div>
      </header>
      <p class="bpp-effect-line">
        When an enemy uses an item, items adjacent to this gain
        <span class="bpp-effect-value bpp-tier-silver">4%</span> »
        <strong class="bpp-effect-value bpp-tier-gold">8%</strong> »
        <span class="bpp-effect-value bpp-tier-diamond">12%</span>
        <span class="bpp-keyword-crit-chance">Crit Chance</span>.
      </p>
      <section>
        <div class="bpp-detail-section-head">
          <h3>Enchantments</h3>
        </div>
        <div class="bpp-detail-enchants">
          <div class="bpp-detail-enchant" data-current="true">
            <span class="bpp-enchant bpp-enchant-icy">Icy</span>
            <p>
              When you Crit with an adjacent item,
              <span class="bpp-keyword-freeze">Freeze</span> an item 0.5
              second(s).
            </p>
          </div>
        </div>
      </section>
    </article>
  </body>
</html>
