<!doctype html>
<html>
<head><meta charset="utf-8"><title>HeroBadge</title>
<style>body{margin:0;padding:20px;background:var(--bg-canvas);color:var(--text-1);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.ds-col{display:flex;flex-direction:column;gap:12px}.ds-cap{color:var(--text-3);font-size:14px;margin:0 0 6px}</style>
</head>
<body>
<div class="ds-col"><div class="ds-row"><span class="bpp-hero-badge" title="Stelle"><span class="bpp-hero-badge-dot" style="background:var(--hero-stelle)"></span><span>STE</span><span class="bpp-hero-badge-value">48.0%</span></span><span class="bpp-hero-badge" title="Mak"><span class="bpp-hero-badge-dot" style="background:var(--hero-mak)"></span><span>MAK</span><span class="bpp-hero-badge-value">49.3%</span></span><span class="bpp-hero-badge is-selected" title="Jules"><span class="bpp-hero-badge-dot" style="background:var(--hero-jules)"></span><span>JUL</span><span class="bpp-hero-badge-value">50.6%</span></span><span class="bpp-hero-badge" title="Dooley"><span class="bpp-hero-badge-dot" style="background:var(--hero-dooley)"></span><span>DOO</span><span class="bpp-hero-badge-value">51.9%</span></span><span class="bpp-hero-badge" title="Karnok"><span class="bpp-hero-badge-dot" style="background:var(--hero-karnok)"></span><span>KAR</span></span><span class="bpp-hero-badge" title="Pygmalien"><span class="bpp-hero-badge-dot" style="background:var(--hero-pygmalien)"></span><span>PYG</span></span><span class="bpp-hero-badge" title="Vanessa"><span class="bpp-hero-badge-dot" style="background:var(--hero-vanessa)"></span><span>VAN</span></span><span class="bpp-hero-badge" title="The Dragons"><span class="bpp-hero-badge-dot" style="background:var(--hero-dragons)"></span><span>DRA</span></span></div>
<div class="ds-row"><span class="bpp-hero-badge"><span class="bpp-hero-badge-dot" style="background:var(--hero-pygmalien)"></span><span>Pygmalien</span></span><span class="bpp-hero-badge"><span class="bpp-hero-badge-dot" style="background:var(--hero-unknown)"></span><span>未知英雄</span></span></div></div>
</body>
</html>
