<!doctype html>
<html>
<head><meta charset="utf-8"><title>Panel</title>
<style>body{margin:0;padding:20px;background:var(--bg-canvas);color:var(--text-1);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.ds-col{display:flex;flex-direction:column;gap:12px}.ds-cap{color:var(--text-3);font-size:14px;margin:0 0 6px}</style>
</head>
<body>
<div class="ds-col">
<div class="bpp-panel"><div class="bpp-row"><div class="bpp-row-copy"><span class="bpp-row-title">插件</span></div><span class="bpp-badge bpp-badge-ok">已安装</span><button type="button" class="bpp-btn bpp-btn-secondary bpp-btn-sm">重新安装</button></div>
<div class="bpp-row"><div class="bpp-row-copy"><span class="bpp-row-title">本地数据</span></div><span class="bpp-page-meta tnum">128 局 · 4.2 GB</span><button type="button" class="bpp-btn bpp-btn-danger bpp-btn-sm">删除</button></div></div>
<div class="bpp-panel"><div class="bpp-kv"><span class="bpp-kv-key">游戏目录</span><span class="bpp-kv-value mono">D:\Games\The Bazaar</span><span class="bpp-kv-actions"><button type="button" class="bpp-btn bpp-btn-ghost bpp-btn-icon-sm" aria-label="打开游戏目录"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></button></span>
<span class="bpp-kv-key">版本</span><span class="bpp-kv-value tnum">v6.2.0</span><span class="bpp-kv-actions"></span>
<span class="bpp-kv-key">直播端口</span><span class="bpp-kv-value is-empty">未设置</span><span class="bpp-kv-actions"></span></div></div>
</div>
</body>
</html>
