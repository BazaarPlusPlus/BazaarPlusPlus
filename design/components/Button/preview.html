<!-- @dsCard group="Actions" height=170 subtitle="Static rendition of the bpp-* markup" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title>
<style>body{margin:0;padding:20px;background:var(--bg-canvas);color:var(--text-1);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.ds-col{display:flex;flex-direction:column;gap:12px}.ds-cap{color:var(--text-3);font-size:14px;margin:0 0 6px}</style>
</head>
<body>
<div class="ds-col">
<div class="ds-row"><button type="button" class="bpp-btn bpp-btn-primary bpp-btn-md"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>安装</button><button type="button" class="bpp-btn bpp-btn-secondary bpp-btn-md"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>选择游戏目录</button><button type="button" class="bpp-btn bpp-btn-ghost bpp-btn-md"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>刷新</button><button type="button" class="bpp-btn bpp-btn-danger bpp-btn-md">删除本地数据</button></div>
<div class="ds-row"><button type="button" class="bpp-btn bpp-btn-secondary bpp-btn-sm">重试</button><button type="button" class="bpp-btn bpp-btn-primary bpp-btn-sm"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>启动游戏</button><button type="button" class="bpp-btn bpp-btn-ghost bpp-btn-icon" aria-label="刷新"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button><button type="button" class="bpp-btn bpp-btn-ghost bpp-btn-icon-sm" aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
<div class="ds-row"><button type="button" class="bpp-btn bpp-btn-primary bpp-btn-md" disabled aria-busy="true" data-busy><svg xmlns="http://www.w3.org/2000/svg" class="bpp-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg><span class="bpp-busy-label"><span aria-hidden="true">安装</span><span>正在安装…</span></span></button><button type="button" class="bpp-btn bpp-btn-primary bpp-btn-md" disabled>安装</button><button type="button" class="bpp-btn bpp-btn-secondary bpp-btn-md" disabled>暂无本地数据</button></div>
</div>
</body>
</html>
