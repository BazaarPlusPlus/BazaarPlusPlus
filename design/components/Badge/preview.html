<!-- @dsCard group="Status" height=180 subtitle="Static rendition of the bpp-* markup" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge</title>
<style>body{margin:0;padding:20px;background:var(--bg-canvas);color:var(--text-1);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.ds-col{display:flex;flex-direction:column;gap:12px}.ds-cap{color:var(--text-3);font-size:14px;margin:0 0 6px}</style>
</head>
<body>
<div class="ds-col">
<div><p class="ds-cap">状态：圆点 + 文字</p><div class="ds-row"><span class="bpp-badge bpp-badge-ok">已安装</span><span class="bpp-badge bpp-badge-warn">需要重新安装</span><span class="bpp-badge bpp-badge-bad">未安装</span><span class="bpp-badge bpp-badge-busy">正在检测</span><span class="bpp-badge bpp-badge-accent">发现更新</span><span class="bpp-badge">未启动</span></div></div>
<div><p class="ds-cap">对局结果与中性标签：无圆点</p><div class="ds-row tnum"><span class="bpp-outcome" data-tier="diamond">10 胜 · 钻石胜利</span><span class="bpp-outcome" data-tier="gold">7 胜 · 黄金胜利</span><span class="bpp-outcome" data-tier="silver">4 胜 · 白银胜利</span><span class="bpp-outcome" data-tier="bronze">2 胜 · 青铜胜利</span><span class="bpp-outcome" data-tier="misfortune">惨淡旅程</span><span class="bpp-outcome" data-state="active">正在进行</span><span class="bpp-badge no-dot">v6.2.0</span></div></div>
</div>
</body>
</html>
