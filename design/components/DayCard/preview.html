<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Day card</title>
    <link
      rel="stylesheet"
      href="../../../bazaarplusplus-installer/src/styles/tokens.css"
    />
    <link rel="stylesheet" href="../bundle.css" />
    <style>
      body {
        background: var(--bg-canvas);
        color: var(--text-1);
        font-family: var(--font-ui);
        padding: var(--space-16);
      }
    </style>
  </head>
  <body>
    <ol>
      <li class="bpp-panel bpp-day-card">
        <h2 class="bpp-day-title">Day 1</h2>
        <div class="bpp-board">
          <span class="bpp-board-slot" style="grid-column: 1"></span
          ><span class="bpp-board-slot" style="grid-column: 2"></span
          ><span class="bpp-board-slot" style="grid-column: 3"></span
          ><span class="bpp-board-slot" style="grid-column: 4"></span
          ><span class="bpp-board-slot" style="grid-column: 5"></span
          ><span class="bpp-board-slot" style="grid-column: 6"></span
          ><span class="bpp-board-slot" style="grid-column: 7"></span
          ><span class="bpp-board-slot" style="grid-column: 8"></span
          ><span class="bpp-board-slot" style="grid-column: 9"></span
          ><span class="bpp-board-slot" style="grid-column: 10"></span>
          <div class="bpp-board-card" style="grid-column: 3/span 3">
            <span class="bpp-card bpp-tier-bronze"
              ><span class="bpp-card-face">Bass</span
              ><span class="bpp-tier-label">Bronze</span></span
            >
          </div>
        </div>
        <details class="bpp-day-decisions">
          <summary>Day decisions</summary>
          <ol>
            <li class="bpp-visit-row">
              <header class="bpp-visit-head">
                <h3>
                  <span class="bpp-visit-identity">
                    <span class="bpp-visit-art"></span
                    ><span
                      ><span class="bpp-visit-hour">Hour 1</span
                      ><strong>Visited Ande</strong></span
                    >
                  </span>
                </h3>
                <div class="bpp-visit-totals">net −2 gold</div>
              </header>
              <div class="bpp-decision-row">
                <span>Bought</span
                ><span class="bpp-decision-card"
                  ><span class="bpp-card-chip bpp-tier-bronze"
                    ><span class="bpp-card-chip-art"></span>Mantis Shrimp
                    <span class="bpp-tier-label">Bronze</span></span
                  ></span
                ><span>2 gold</span>
              </div>
            </li>
          </ol>
        </details>
      </li>
    </ol>
  </body>
</html>
