<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog</title>
<style>body{margin:0;padding:20px;background:var(--bg-canvas);color:var(--text-1);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.ds-col{display:flex;flex-direction:column;gap:12px}.ds-cap{color:var(--text-3);font-size:14px;margin:0 0 6px}</style>
</head>
<body>
<div class="bpp-dialog-card is-md" role="dialog" aria-labelledby="t" style="animation:none;width:100%">
<div class="bpp-dialog-header"><span class="bpp-dialog-icon is-danger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span><div class="bpp-dialog-heading"><h2 id="t" class="bpp-dialog-title">删除本地数据</h2></div><button type="button" class="bpp-btn bpp-btn-ghost bpp-btn-icon-sm" aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
<div class="bpp-dialog-body">
<p>将删除数据库、截图和回放。游戏和插件不受影响。</p>
<div class="bpp-confirm-target">目标：D:\Games\The Bazaar 内的 BazaarPlusPlusV6 文件夹</div>
<label class="bpp-confirm-ack"><input type="checkbox" checked> 我知道未上传的对局也会被删除。</label>
</div>
<div class="bpp-dialog-footer"><button type="button" class="bpp-btn bpp-btn-ghost bpp-btn-md">取消</button><button type="button" class="bpp-btn bpp-btn-danger bpp-btn-md">删除本地数据</button></div>
</div>
</body>
</html>
