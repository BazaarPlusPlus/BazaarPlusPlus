<!-- @dsCard group="Feedback" height=180 subtitle="Static rendition of the bpp-* markup" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast</title>
<style>body{margin:0;padding:20px;background:var(--bg-canvas);color:var(--text-1);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.ds-col{display:flex;flex-direction:column;gap:12px}.ds-cap{color:var(--text-3);font-size:14px;margin:0 0 6px}</style>
</head>
<body>
<div class="ds-col" style="align-items:flex-end;max-width:400px">
<div class="bpp-toast is-success is-present" role="status"><span class="bpp-toast-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span><div class="bpp-toast-copy"><p class="bpp-toast-message">本地数据已删除</p></div><button type="button" class="bpp-toast-close" aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
<div class="bpp-toast is-info is-present" role="status"><span class="bpp-toast-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span><div class="bpp-toast-copy"><p class="bpp-toast-message">更新已就绪</p><button type="button" class="bpp-toast-action">重启</button></div><button type="button" class="bpp-toast-close" aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
</div>
</body>
</html>
