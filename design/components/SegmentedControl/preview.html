<!doctype html>
<html>
<head><meta charset="utf-8"><title>SegmentedControl</title>
<style>body{margin:0;padding:20px;background:var(--bg-canvas);color:var(--text-1);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.ds-col{display:flex;flex-direction:column;gap:12px}.ds-cap{color:var(--text-3);font-size:14px;margin:0 0 6px}</style>
</head>
<body>
<div class="ds-row"><div role="radiogroup" aria-label="mode" class="bpp-segmented-control"><label class="bpp-segmented-label"><input class="bpp-segmented-input" type="radio" name="mode" checked><span class="bpp-segmented-option">全部</span></label><label class="bpp-segmented-label"><input class="bpp-segmented-input" type="radio" name="mode"><span class="bpp-segmented-option">排位</span></label><label class="bpp-segmented-label"><input class="bpp-segmented-input" type="radio" name="mode"><span class="bpp-segmented-option">匹配</span></label><label class="bpp-segmented-label"><input class="bpp-segmented-input" type="radio" name="mode"><span class="bpp-segmented-option">普通</span></label></div><div role="radiogroup" aria-label="window" class="bpp-segmented-control"><label class="bpp-segmented-label"><input class="bpp-segmented-input" type="radio" name="window"><span class="bpp-segmented-option">7 天</span></label><label class="bpp-segmented-label"><input class="bpp-segmented-input" type="radio" name="window" checked><span class="bpp-segmented-option">30 天</span></label><label class="bpp-segmented-label"><input class="bpp-segmented-input" type="radio" name="window"><span class="bpp-segmented-option">全部</span></label></div></div>
</body>
</html>
