<!-- @dsCard group="Feedback" height=360 subtitle="Static rendition of the bpp-* markup" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusPanel</title>
<style>body{margin:0;padding:20px;background:var(--bg-canvas);color:var(--text-1);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.ds-col{display:flex;flex-direction:column;gap:12px}.ds-cap{color:var(--text-3);font-size:14px;margin:0 0 6px}</style>
</head>
<body>
<div class="ds-col">
<div role="status" aria-busy="true" class="bpp-panel bpp-status-panel is-compact"><span class="bpp-status-panel-mark is-loading"><svg xmlns="http://www.w3.org/2000/svg" class="bpp-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg></span><span>正在检测 The Bazaar 与 BazaarPlusPlus</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<section class="bpp-panel bpp-status-panel"><span class="bpp-status-panel-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></span><h3 class="bpp-status-panel-title">还没有战绩</h3><p class="bpp-status-panel-body">完成一局游戏后，战绩会出现在这里。</p><div class="bpp-status-panel-actions"><button type="button" class="bpp-btn bpp-btn-primary bpp-btn-md"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>刷新战绩</button><button type="button" class="bpp-btn bpp-btn-secondary bpp-btn-md">检查游戏目录</button></div></section>
<section class="bpp-panel bpp-status-panel"><span class="bpp-status-panel-mark is-error"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></span><h3 class="bpp-status-panel-title">未能读取英雄数据</h3><div class="bpp-status-panel-actions"><button type="button" class="bpp-btn bpp-btn-secondary bpp-btn-md"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>重试</button></div></section>
</div></div>
</body>
</html>
