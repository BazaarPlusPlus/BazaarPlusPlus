<!-- @dsCard group="Feedback" height=330 subtitle="Static rendition of the bpp-* markup" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusBanner</title>
<style>body{margin:0;padding:20px;background:var(--bg-canvas);color:var(--text-1);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.ds-col{display:flex;flex-direction:column;gap:12px}.ds-cap{color:var(--text-3);font-size:14px;margin:0 0 6px}</style>
</head>
<body>
<div class="ds-col">
<div class="bpp-banner is-info" role="status"><span class="bpp-banner-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span><div class="bpp-banner-body"><div class="bpp-banner-message"><p style="margin:0">The Bazaar 正在运行。重新安装前，请先退出游戏。</p></div></div></div>
<div class="bpp-banner is-warning" role="status"><span class="bpp-banner-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span><div class="bpp-banner-body"><div class="bpp-banner-message"><p style="margin:0">发现 BazaarPlusPlusV5 的战绩。</p></div></div><div class="bpp-banner-actions"><button type="button" class="bpp-btn bpp-btn-secondary bpp-btn-sm">导入</button></div></div>
<div class="bpp-banner is-error" role="status"><span class="bpp-banner-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg></span><div class="bpp-banner-body"><div class="bpp-banner-message"><p style="margin:0">未能读取战绩。请先关闭游戏。</p></div><details class="bpp-banner-diagnostic"><summary>查看诊断信息</summary><pre>SqliteError: database is locked (code 5)</pre></details></div><div class="bpp-banner-actions"><button type="button" class="bpp-btn bpp-btn-secondary bpp-btn-sm">重试</button></div></div>
<div class="bpp-banner is-success" role="status"><span class="bpp-banner-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span><div class="bpp-banner-body"><div class="bpp-banner-message"><p style="margin:0">安装完成</p></div></div></div>
</div>
</body>
</html>
