name: Analyzer

# Production analyzer V6 runs. Each run restores the Data Root from the private
# R2 state bucket, heals settled Source Hours, publishes both consumer
# snapshots to the V6 metrics bucket and mirrors the Data Root back. Snapshots
# still advance once per Complete Source Day; the hourly schedule keeps each
# run's intake small. Secrets live in the `analyzer` GitHub Environment
# (release/github-secrets.json); see
# bazaarplusplus-analyzer/docs/architecture.md, Production runs.

# The V6 Bundle Server Worker dispatches this workflow at :23 every hour
# (bazaarplusplus-server/src/modules/analyzer-dispatch.ts) because GitHub drops
# most scheduled events. This schedule is only a fallback for when the Worker
# cannot reach GitHub; it sits at :53 so it never queues behind a dispatch.
on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish snapshots to the V6 metrics bucket
        type: boolean
        default: true

permissions:
  contents: read

# The R2 state bucket has one writer; a run never cancels another mid-sync.
# A run still going when the next dispatch arrives leaves one pending run, and
# later triggers replace that pending run rather than stacking up.
concurrency:
  group: analyzer-v6
  cancel-in-progress: false

jobs:
  run:
    name: Analyzer V6
    if: github.repository == 'BazaarPlusPlus/BazaarPlusPlus'
    runs-on: ubuntu-latest
    environment: analyzer
    # BPP_MAX_RUN_SECONDS stops the pipeline at five hours, leaving time to
    # mirror committed hours back before the six-hour job limit.
    timeout-minutes: 340
    env:
      BPP_ANALYZER_STATE_BUCKET: bazaarplusplus-analyzer-state-v6
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: gate
        name: Check analyzer secrets
        env:
          BPP_BUNDLE_SYNC_TOKEN: ${{ secrets.BPP_BUNDLE_SYNC_TOKEN }}
          BPP_ANALYZER_R2_TOKEN: ${{ secrets.BPP_ANALYZER_R2_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          missing=()
          for name in BPP_BUNDLE_SYNC_TOKEN BPP_ANALYZER_R2_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "BPP_DATA_ROOT=$RUNNER_TEMP/bpp-data" >> "$GITHUB_ENV"
          elif [ "$EVENT" = schedule ]; then
            # Until the environment is provisioned, scheduled runs stay quiet.
            echo "::notice::Analyzer skipped; missing ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing ${missing[*]} in the analyzer environment"
            exit 1
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: bazaarplusplus-analyzer
      - if: steps.gate.outputs.ready == 'true'
        run: uv sync --locked --no-dev
        working-directory: bazaarplusplus-analyzer

      - if: steps.gate.outputs.ready == 'true'
        name: Write analyzer configuration
        working-directory: bazaarplusplus-analyzer
        env:
          BPP_BUNDLE_SYNC_TOKEN: ${{ secrets.BPP_BUNDLE_SYNC_TOKEN }}
          BPP_ANALYZER_R2_TOKEN: ${{ secrets.BPP_ANALYZER_R2_TOKEN }}
        run: |
          # bppanalyzer.config reads only this file, never the environment.
          umask 077
          {
            echo "BPP_DATA_ROOT=$BPP_DATA_ROOT"
            echo "BPP_API_BASE_URL=https://mod-api-v6.bazaarplusplus.com"
            echo "BPP_BUNDLE_SYNC_TOKEN=$BPP_BUNDLE_SYNC_TOKEN"
            echo "BPP_METRICS_R2_BUCKET=bazaarplusplus-metrics-v6"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_API_TOKEN=$BPP_ANALYZER_R2_TOKEN"
            # The V6 Bundle Server went live on this Source Day.
            echo "BPP_SOURCE_EPOCH=2026-10-11"
            echo "BPP_MAX_RUN_SECONDS=18000"
            echo "BPP_DUCKDB_THREADS=4"
          } > .env

      - if: steps.gate.outputs.ready == 'true'
        name: Derive the R2 S3 key pair
        working-directory: bazaarplusplus-analyzer
        env:
          BPP_ANALYZER_R2_TOKEN: ${{ secrets.BPP_ANALYZER_R2_TOKEN }}
        run: |
          uv run --locked --no-dev python - <<'PY'
          import os
          from bppanalyzer.object_store import derive_s3_credentials

          key_id, secret = derive_s3_credentials(
              os.environ["BPP_ANALYZER_R2_TOKEN"], account_id=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          )
          print(f"::add-mask::{key_id}")
          print(f"::add-mask::{secret}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"AWS_ACCESS_KEY_ID={key_id}\nAWS_SECRET_ACCESS_KEY={secret}\n")
          PY

      - id: pull
        if: steps.gate.outputs.ready == 'true'
        name: Restore the Data Root
        run: bash .github/scripts/analyzer-state.sh pull
      - if: steps.pull.outcome == 'success'
        name: Verify restored facts
        working-directory: bazaarplusplus-analyzer
        run: uv run --locked --no-dev bpp verify --deep

      - id: analyze
        if: steps.pull.outcome == 'success'
        name: Run the analyzer
        working-directory: bazaarplusplus-analyzer
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          args=(run --quiet)
          [ "$PUBLISH" = true ] || args+=(--no-publish)
          uv run --locked --no-dev bpp "${args[@]}"

      # Retention deletions are mirrored only after a fully successful run; a
      # failed one uploads the hours it committed and deletes nothing.
      - if: steps.analyze.outcome == 'success'
        name: Mirror the Data Root
        run: bash .github/scripts/analyzer-state.sh push
      - if: always() && steps.analyze.outcome == 'failure'
        name: Upload committed hours
        run: bash .github/scripts/analyzer-state.sh push-new

      - if: always() && steps.pull.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analyzer-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bpp-data/status.json
            ${{ runner.temp }}/bpp-data/logs/
          retention-days: 14
          if-no-files-found: ignore
