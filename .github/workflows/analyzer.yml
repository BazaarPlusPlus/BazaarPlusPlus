name: Operations / Analyzer

# Production analyzer V6 runs. Each run restores the Data Root from
# analyzer-state/ in the private Bundle bucket, heals settled Source Hours,
# publishes both consumer snapshots to metrics/v6/ in the public bucket
# (https://cdn.bazaarplusplus.com/metrics/v6) and mirrors the Data Root back. Snapshots
# still advance once per Complete Source Day; the hourly schedule keeps each
# run's intake small. The Bundle Server token lives in the `analyzer` GitHub
# Environment and the Cloudflare operator token is a repository secret
# (release/github-secrets.json); see
# bazaarplusplus-analyzer/docs/architecture.md, Production runs.

# GitHub runs scheduled workflows on a best-effort basis and drops many of
# these hourly events. A dropped hour is not lost: the next run that fires
# ingests every settled Source Hour since the last one, so collection only
# arrives in larger batches, and snapshots still advance once per Complete
# Source Day.
#
# daily-report.yml calls this workflow before its report and reads two
# outputs: `day`, the window.end this run analyzed, and `highlights`, that
# day's Daily Highlights.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish snapshots to metrics/v6 in the public bucket
        type: boolean
        default: true
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: true
    outputs:
      day:
        value: ${{ jobs.run.outputs.day }}
      highlights:
        value: ${{ jobs.run.outputs.highlights }}

permissions:
  contents: read

jobs:
  run:
    name: Analyzer V6
    if: github.repository == 'BazaarPlusPlus/BazaarPlusPlus'
    runs-on: ubuntu-latest
    environment: analyzer
    # The R2 state bucket has one writer; a run never cancels another mid-sync.
    # A run still going when the next trigger arrives leaves one pending run,
    # and later triggers replace that pending run rather than stacking up. The
    # group is on the job so that a run daily-report.yml calls joins it too.
    concurrency:
      group: analyzer-v6
      cancel-in-progress: false
    outputs:
      day: ${{ steps.window.outputs.day }}
      highlights: ${{ steps.highlights.outputs.json }}
    # BPP_MAX_RUN_SECONDS stops the pipeline at five hours, leaving time to
    # mirror committed hours back before the six-hour job limit.
    timeout-minutes: 340
    env:
      # The bucket's 8-day lifecycle rule covers only bundles/.
      BPP_ANALYZER_STATE_BUCKET: bazaarplusplus-bundle-v6
      BPP_ANALYZER_STATE_PREFIX: analyzer-state
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check analyzer secrets
        env:
          BPP_BUNDLE_SYNC_TOKEN: ${{ secrets.BPP_BUNDLE_SYNC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=()
          for name in BPP_BUNDLE_SYNC_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing ${missing[*]} in the analyzer environment"
            exit 1
          fi
          echo "BPP_DATA_ROOT=$RUNNER_TEMP/bpp-data" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: bazaarplusplus-analyzer
      - run: uv sync --locked --no-dev
        working-directory: bazaarplusplus-analyzer

      - name: Write analyzer configuration
        working-directory: bazaarplusplus-analyzer
        env:
          BPP_BUNDLE_SYNC_TOKEN: ${{ secrets.BPP_BUNDLE_SYNC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # bazaarlens.config reads only this file, never the environment.
          umask 077
          {
            echo "BPP_DATA_ROOT=$BPP_DATA_ROOT"
            echo "BPP_API_BASE_URL=https://mod-api-v6.bazaarplusplus.com"
            echo "BPP_BUNDLE_SYNC_TOKEN=$BPP_BUNDLE_SYNC_TOKEN"
            echo "BPP_METRICS_R2_BUCKET=bazaarplusplus-public"
            echo "BPP_METRICS_R2_PREFIX=metrics/v6"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            # The first full Source Day of 6.0.0 traffic; 6.0.0 shipped on 2026-10-29,
            # and earlier days hold only pre-release Bundles.
            echo "BPP_SOURCE_EPOCH=2026-10-30"
            echo "BPP_MAX_RUN_SECONDS=18000"
            echo "BPP_DUCKDB_THREADS=4"
          } > .env

      - name: Derive the R2 S3 key pair
        working-directory: bazaarplusplus-analyzer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          uv run --locked --no-dev python - <<'PY'
          import os
          from bazaarlens.object_store import derive_s3_credentials

          key_id, secret = derive_s3_credentials(
              os.environ["CLOUDFLARE_API_TOKEN"], account_id=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          )
          print(f"::add-mask::{key_id}")
          print(f"::add-mask::{secret}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"AWS_ACCESS_KEY_ID={key_id}\nAWS_SECRET_ACCESS_KEY={secret}\n")
          PY

      - id: pull
        name: Restore the Data Root
        run: bash .github/scripts/analyzer-state.sh pull
      - if: steps.pull.outcome == 'success'
        name: Verify restored facts
        working-directory: bazaarplusplus-analyzer
        run: uv run --locked --no-dev bazaarlens verify --deep

      # status.json keeps the previous run's last_run until this run ends; its
      # run_id tells a report of this run from a restored one.
      - id: before
        if: steps.pull.outcome == 'success'
        name: Note the restored run
        run: echo "run_id=$(jq -r '.last_run.run_id // ""' "$BPP_DATA_ROOT/status.json" 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - id: analyze
        if: steps.pull.outcome == 'success'
        name: Run the analyzer
        working-directory: bazaarplusplus-analyzer
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          args=(run --quiet)
          [ "$PUBLISH" = true ] || args+=(--no-publish)
          uv run --locked --no-dev bazaarlens "${args[@]}"

      # The window.end this run analyzed, even when a later stage such as
      # retention failed.
      - id: window
        if: always() && steps.analyze.outcome != 'skipped'
        name: Name the analyzed day
        env:
          BEFORE: ${{ steps.before.outputs.run_id }}
        run: |
          [ -f "$BPP_DATA_ROOT/status.json" ] || exit 0
          jq -r --arg before "$BEFORE" '
            .last_run | select(. != null and .run_id != $before and .report.window != null)
            | "day=\(.report.window.end)"' "$BPP_DATA_ROOT/status.json" >> "$GITHUB_OUTPUT"

      # Daily Highlights name players, so they leave the job only as an output
      # for daily-report.yml, never to a bucket.
      - id: highlights
        if: always() && steps.window.outputs.day != ''
        name: Build the Daily Highlights
        continue-on-error: true
        working-directory: bazaarplusplus-analyzer
        env:
          DAY: ${{ steps.window.outputs.day }}
        run: |
          json=$(uv run --locked --no-dev bazaarlens highlights --day "$DAY")
          echo "json=$json" >> "$GITHUB_OUTPUT"

      # Retention deletions are mirrored only after a fully successful run; a
      # failed one uploads the hours it committed and deletes nothing.
      - if: steps.analyze.outcome == 'success'
        name: Mirror the Data Root
        run: bash .github/scripts/analyzer-state.sh push
      - if: always() && steps.analyze.outcome == 'failure'
        name: Upload committed hours
        run: bash .github/scripts/analyzer-state.sh push-new

      - if: always() && steps.pull.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyzer-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bpp-data/status.json
            ${{ runner.temp }}/bpp-data/logs/
          retention-days: 14
          if-no-files-found: ignore
