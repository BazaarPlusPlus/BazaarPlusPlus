name: Delivery / Publish UI package

# Publishes @bazaarplusplus/ui to GitHub Packages on ui-v* tags or manual dispatch.
# GitHub Packages does not support npm --provenance; GITHUB_TOKEN with packages: write authenticates it.
on:
  push:
    tags:
      - 'ui-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and run npm publish --dry-run without publishing
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @bazaarplusplus/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.58.0
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/ui-v')
        run: |
          tag_version="${GITHUB_REF_NAME#ui-v}"
          pkg_version="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/ui/package.json").text()).version)')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ui-v$tag_version does not match packages/ui/package.json version $pkg_version"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: just design::check ui::check ui::test ui::pack-check
      - name: Strip dev-only export condition
        run: bun packages/ui/tools/publish-manifest.ts --apply packages/ui/package.json
      - name: Publish to GitHub Packages
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          cat > .npmrc <<'EOF'
          @bazaarplusplus:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          trap 'rm -f .npmrc' EXIT
          if [ "$DRY_RUN" = 'true' ]; then
            npm publish --dry-run
          else
            npm publish
          fi
