name: CI / Checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      scope:
        description: Projects to verify
        type: choice
        options: [full, installer, mod]
        default: full
      platform:
        description: Native platforms to verify
        type: choice
        options: [all, macos, windows, android]
        default: all

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.scope }}-${{ inputs.platform }}
  # Let master finish the post-job cache save even when another merge arrives.
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}

# Explicit platform jobs let the summary verify each selected native result.
jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.scope.outputs.release }}
      site: ${{ steps.scope.outputs.site }}
      server: ${{ steps.scope.outputs.server }}
      analyzer: ${{ steps.scope.outputs.analyzer }}
      installer-frontend: ${{ steps.scope.outputs.installer-frontend }}
      installer-macos: ${{ steps.scope.outputs.installer-macos }}
      installer-windows: ${{ steps.scope.outputs.installer-windows }}
      mod-macos: ${{ steps.scope.outputs.mod-macos }}
      mod-windows: ${{ steps.scope.outputs.mod-windows }}
      mod-android: ${{ steps.scope.outputs.mod-android }}
      android: ${{ steps.scope.outputs.android }}
      macos-icon: ${{ steps.scope.outputs.macos-icon }}
      plan: ${{ steps.scope.outputs.plan }}
      compatibility: ${{ steps.scope.outputs.compatibility }}
      performance: ${{ steps.scope.outputs.performance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep the scripts available even if fetching history fails. The
      # classifier falls back to full coverage if a diff cannot be obtained.
      - id: history
        name: Fetch complete history for change detection
        continue-on-error: true
        run: git fetch --no-tags --unshallow origin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: scope
        run: node .github/scripts/checks-scope.mjs
        env:
          HISTORY_FETCH_OUTCOME: ${{ steps.history.outcome }}

  macos-icon:
    name: macOS Icon Composer asset
    needs: classify
    if: needs.classify.outputs.macos-icon == 'true'
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: |
          xcodebuild -version
          node bazaarplusplus-installer/scripts/release/compile-macos-icon.mjs

  release:
    name: Release tooling
    needs: classify
    if: needs.classify.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: bazaarplusplus-mod/global.json
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0
      - run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: npm ci
      - run: just commands-check design::check release::check release::test
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  site:
    name: site (full check and test)
    needs: classify
    if: needs.classify.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: site
      WRANGLER_SEND_METRICS: 'false'
    steps: &node-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bazaarplusplus-${{ env.PROJECT }}/package-lock.json
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0
      - run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: npm ci
        working-directory: bazaarplusplus-${{ env.PROJECT }}
      - if: env.PROJECT == 'site'
        working-directory: bazaarplusplus-site
        run: npx playwright install --with-deps chromium
      - if: env.PROJECT == 'site'
        run: just site::ci
      - if: failure() && env.PROJECT == 'site'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-e2e-results
          path: |
            bazaarplusplus-site/test-results/
            bazaarplusplus-site/e2e/__snapshots__/
          if-no-files-found: ignore
      - if: env.PROJECT == 'server'
        run: just server::check server::test

  server:
    name: server (full check and test)
    needs: classify
    if: needs.classify.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: server
      WRANGLER_SEND_METRICS: 'false'
    steps: *node-steps

  installer-frontend:
    name: Installer (frontend)
    needs: classify
    if: needs.classify.outputs.installer-frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bazaarplusplus-installer/package-lock.json
      - run: npm install --global "$(node --print "require('./package.json').packageManager")"
        working-directory: bazaarplusplus-installer
      - name: Install Installer npm dependencies
        run: npm ci
        working-directory: bazaarplusplus-installer
      # Consume committed bindings; native inputs also select real generation.
      - name: Verify Installer
        run: npm run verify -- --source-only --subset frontend
        working-directory: bazaarplusplus-installer

  installer-macos:
    name: Installer (macos-26)
    needs: classify
    if: needs.classify.outputs.installer-macos == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env: &installer-env
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps: &installer-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bazaarplusplus-installer/package-lock.json
      - name: Install the repository Rust toolchain and components
        working-directory: bazaarplusplus-installer
        run: |
          rustc --version
          rustup show active-toolchain
      - name: Restore Installer Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: bazaarplusplus-installer/src-tauri
          # Include these in the prefix so even fallback restores cannot cross
          # toolchain, lockfile or build-configuration changes.
          # Preserve the former matrix job ID suffix without coupling the
          # cache namespace to the new job IDs. shared-key replaces key + job.
          shared-key: installer-${{ runner.os == 'macOS' && 'macos-26' || 'windows-latest' }}-${{ runner.arch }}-${{ hashFiles('bazaarplusplus-installer/rust-toolchain.toml', 'bazaarplusplus-installer/src-tauri/Cargo.lock', 'bazaarplusplus-installer/src-tauri/.cargo/config.toml') }}-installer
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - run: npm install --global "$(node --print "require('./package.json').packageManager")"
        working-directory: bazaarplusplus-installer
      - name: Install Installer npm dependencies
        run: npm ci
        working-directory: bazaarplusplus-installer
      # Real binding generation precedes the diff check. Windows also repeats
      # script tests; both platforms use an empty source resource bundle.
      - name: Verify Installer
        run: npm run verify -- --source-only --subset native
        working-directory: bazaarplusplus-installer

  installer-windows:
    name: Installer (windows-latest)
    needs: classify
    if: needs.classify.outputs.installer-windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env: *installer-env
    defaults:
      run:
        shell: bash
    steps: *installer-steps

  analyzer:
    name: Analyzer
    needs: classify
    if: needs.classify.outputs.analyzer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: bazaarplusplus-analyzer
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0
      - run: uv sync --locked
        working-directory: bazaarplusplus-analyzer
      - run: just analyzer::check analyzer::test

  mod-macos:
    name: Mod (macos-26)
    needs: classify
    # Fork PRs have no private snapshots; summary records the explicit exception.
    if: needs.classify.outputs.mod-macos == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BPP_CI_PLATFORM: macos
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps: &mod-steps
      - name: Require private store credentials
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing; selected Mod checks cannot run.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: bazaarplusplus-mod/global.json
          cache: true
          cache-dependency-path: bazaarplusplus-mod/**/packages.lock.json
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0
      # A null online entry fails here, naming the snapshot to capture.
      - name: Fetch the online snapshot
        run: just mod::fetch "$BPP_CI_PLATFORM" online
      - run: just verify mod::check mod::test
      - if: needs.classify.outputs.performance == 'true'
        run: just verify mod::test-performance
      - name: Preserve verification and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-test-diagnostics-${{ env.BPP_CI_PLATFORM }}
          path: |
            artifacts/verification/
            bazaarplusplus-mod/artifacts/tests/
          if-no-files-found: warn
      - name: Preserve Combat Impact corpus evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: combat-impact-corpus-${{ env.BPP_CI_PLATFORM }}
          path: bazaarplusplus-mod/artifacts/combat-impact-corpus/*.json
          if-no-files-found: error
      # Compatibility is a snapshot-update and release gate, not a daily gate.
      - if: needs.classify.outputs.compatibility == 'true'
        run: just mod::matrix staging ptr

  mod-windows:
    name: Mod (windows-latest)
    needs: classify
    if: needs.classify.outputs.mod-windows == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BPP_CI_PLATFORM: windows
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps: *mod-steps

  # The Android host compiles against the Interop Snapshot, which the Linux runner can fetch;
  # only suites that need no Managed snapshot run here (`just mod::test-core`).
  mod-android:
    name: Mod (android, ubuntu-latest)
    needs: classify
    if: needs.classify.outputs.mod-android == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require private store credentials
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing; selected Mod checks cannot run.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: bazaarplusplus-mod/global.json
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0
      # A null android-online entry fails here, naming the snapshot to capture.
      - name: Fetch the Interop Snapshot and Loader Release
        run: just mod::fetch android online
      - run: just verify mod::android-build mod::test-core
      - name: Preserve verification and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-test-diagnostics-android
          path: |
            artifacts/verification/
            bazaarplusplus-mod/artifacts/tests/
          if-no-files-found: warn

  # The Android App needs no game files or private store: lint, both APKs without a staged
  # runtime, and the JVM unit tests. The SDK packages come from the toolchain lock.
  android:
    name: Android App (ubuntu-latest)
    needs: classify
    if: needs.classify.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bazaarplusplus-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: echo "jdk=$(jq -r .jdk.major toolchain.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.lock.outputs.jdk }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0
      - name: Install the locked Android SDK packages
        run: |
          lock=toolchain.lock.json
          platform="platforms;android-$(jq -r .androidSdk.compileSdk "$lock")"
          tools="build-tools;$(jq -r .androidSdk.buildTools "$lock")"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$platform" "$tools"
      - run: just android::check android::test
      - name: Preserve lint and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-app-reports
          path: |
            bazaarplusplus-android/app/build/reports/
            bazaarplusplus-android/app/build/test-results/
          if-no-files-found: warn

  summary:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Manual checks ({0}/{1})', inputs.scope, inputs.platform) || 'Checks summary' }}
    # A dispatch check on the same SHA must never satisfy PR protection.
    if: always()
    needs:
      [
        classify,
        release,
        site,
        server,
        analyzer,
        installer-frontend,
        installer-macos,
        installer-windows,
        mod-macos,
        mod-windows,
        mod-android,
        android,
        macos-icon
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/checks-summary.mjs
        env:
          CHECK_NEEDS: ${{ toJSON(needs) }}
          MOD_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}

  bot-mod-boundary:
    name: Bot Mod dependency boundary
    if: github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'renovate[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject Mod runtime or transitive dependency changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:.github/scripts/check_mod_dependency_update.py" > "$RUNNER_TEMP/check_mod_dependency_update.py"
          python3 "$RUNNER_TEMP/check_mod_dependency_update.py" "$BASE_SHA" "$HEAD_SHA"
