name: Checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: bazaarplusplus-mod/global.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: npm ci
      - run: just commands-check release::check release::test
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: node --test .github/scripts/*.test.mjs

  node:
    name: ${{ matrix.project }} (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: site
            scope: full check and test
          - project: server
            scope: full check and test
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bazaarplusplus-${{ matrix.project }}/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: npm ci
        working-directory: bazaarplusplus-${{ matrix.project }}
      - run: just '${{ matrix.project }}::check'
      - if: matrix.project == 'site'
        run: |
          just site::test
          npm --prefix bazaarplusplus-site run deploy:dry-run
          npm --prefix bazaarplusplus-site run deploy:preview:dry-run
      - if: matrix.project == 'site'
        working-directory: bazaarplusplus-site
        run: npx playwright install --with-deps chromium
      - if: matrix.project == 'site'
        run: just site::e2e golden
      - if: failure() && matrix.project == 'site'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-e2e-results
          path: |
            bazaarplusplus-site/test-results/
            bazaarplusplus-site/e2e/__snapshots__/
          if-no-files-found: ignore
      - if: matrix.project == 'server'
        run: just server::test

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bazaarplusplus-installer/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Install the repository Rust toolchain and components
        working-directory: bazaarplusplus-installer
        run: |
          rustc --version
          rustup show active-toolchain
      - run: npm install --global "$(node --print "require('./package.json').packageManager")"
        working-directory: bazaarplusplus-installer
      - run: npm ci
        working-directory: bazaarplusplus-installer
      # Includes Rust/JS tests, binding freshness and frontend build. The source
      # gate supplies an empty resource bundle; game assemblies are not required.
      - run: just installer::check

  analyzer:
    name: Analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: bazaarplusplus-analyzer
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - run: uv sync --locked
        working-directory: bazaarplusplus-analyzer
      - run: just analyzer::check analyzer::test

  mod:
    name: Mod (${{ matrix.os }})
    # Game assemblies are a locked build input fetched from the private Snapshot
    # store (docs/adr/0004-pinned-game-assembly-snapshots.md). A fork PR never
    # receives the store secrets, so the lane runs only for the repository's own
    # branches; inside the repository it skips, with a warning, until the three
    # BPP_GAME_LIBS_R2_* secrets exist (Dependabot PRs see Dependabot secrets, so
    # register them there too). An empty lock entry is a failure, never a skip.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows
    defaults:
      run:
        shell: bash
    env:
      # release/game-libs.mjs reads the BPP_R2_* names; the bucket is fixed there.
      BPP_R2_ACCOUNT_ID: ${{ secrets.BPP_GAME_LIBS_R2_ACCOUNT_ID }}
      BPP_R2_ACCESS_KEY_ID: ${{ secrets.BPP_GAME_LIBS_R2_ACCESS_KEY_ID }}
      BPP_R2_SECRET_ACCESS_KEY: ${{ secrets.BPP_GAME_LIBS_R2_SECRET_ACCESS_KEY }}
    steps:
      - id: store
        name: Probe the private store secrets
        run: |
          if [[ -n "$BPP_R2_ACCOUNT_ID" && -n "$BPP_R2_ACCESS_KEY_ID" && -n "$BPP_R2_SECRET_ACCESS_KEY" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=Mod lane skipped::BPP_GAME_LIBS_R2_ACCOUNT_ID, BPP_GAME_LIBS_R2_ACCESS_KEY_ID and BPP_GAME_LIBS_R2_SECRET_ACCESS_KEY are not available to this run; mod::check, mod::test and the CompatCheck builds did not run.'
            echo 'Mod lane skipped: the private store secrets are not available to this run, so nothing was compiled or tested against the game.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.store.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.store.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - if: steps.store.outputs.ready == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: bazaarplusplus-mod/global.json
          cache: true
          cache-dependency-path: bazaarplusplus-mod/**/packages.lock.json
      - if: steps.store.outputs.ready == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      # A null online entry fails here, naming the snapshot to capture.
      - if: steps.store.outputs.ready == 'true'
        name: Fetch the online snapshot
        env:
          PLATFORM: ${{ matrix.platform }}
        run: just mod::fetch "$PLATFORM" online
      - if: steps.store.outputs.ready == 'true'
        run: just mod::check
      - if: steps.store.outputs.ready == 'true'
        run: just mod::test
      # Compatibility builds against the other two channels; a null entry fails.
      - if: steps.store.outputs.ready == 'true'
        run: just mod::matrix staging ptr

  bot-mod-boundary:
    name: Bot Mod dependency boundary
    if: github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'renovate[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject Mod runtime or transitive dependency changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:.github/scripts/check_mod_dependency_update.py" > "$RUNNER_TEMP/check_mod_dependency_update.py"
          python3 "$RUNNER_TEMP/check_mod_dependency_update.py" "$BASE_SHA" "$HEAD_SHA"
