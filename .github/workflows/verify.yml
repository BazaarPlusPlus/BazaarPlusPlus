name: Verification

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  release-and-portable-mod:
    name: Release and mod (game-independent subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: bazaarplusplus-mod/global.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Install root tooling
        run: |
          npm install --global "$(node --print 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          npm ci
      - run: just commands-check release::check release::test
      - run: just mod::check-portable mod::test-portable
      - name: Report mod coverage boundary
        run: |
          echo 'Public CI runs mod formatting, locked restores, and the game-independent xUnit hosts. The complete just mod::check and just mod::test gates still require local game Managed assemblies; this job does not verify them.' >> "$GITHUB_STEP_SUMMARY"

  node-projects:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [site, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bazaarplusplus-${{ matrix.project }}/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.project == 'server'
        with:
          global-json-file: bazaarplusplus-mod/global.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Install npm
        run: npm install --global "$(node --print 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
      - run: npm ci
        working-directory: bazaarplusplus-${{ matrix.project }}
      - run: just ${{ matrix.project }}::check ${{ matrix.project }}::test

  installer:
    name: Installer source (macOS)
    runs-on: macos-15
    # Source checks compile all Rust code but do not package a game Payload.
    env:
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bazaarplusplus-installer/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Install npm
        run: npm install --global "$(node --print 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
      - run: npm ci
        working-directory: bazaarplusplus-installer
      - name: Install the pinned Rust toolchain and components
        run: rustup show
        working-directory: bazaarplusplus-installer
      - run: just installer::check installer::test
      - name: Report installer coverage boundary
        run: |
          echo 'Installer CI runs the full source gate with bundle resource copying disabled. Release Payload validation, native platform packaging, signing, and publication remain separate release gates.' >> "$GITHUB_STEP_SUMMARY"

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          working-directory: bazaarplusplus-analyzer
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Install Python from .python-version and the locked environment
        run: uv sync --locked
        working-directory: bazaarplusplus-analyzer
      - run: just analyzer::check analyzer::test
