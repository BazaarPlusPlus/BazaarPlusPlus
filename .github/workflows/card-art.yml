name: Card Art

# Keeps the public Card Art set (root ADR 0020) in step with the game. Every
# six hours it compares the Steam online buildid and both GameData and translation ETags
# with the published card-art/index.json. When either moved, it downloads the
# art bundles, extracts them and publishes the new set. A failure only fails
# this workflow; the next run tries again.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-art
  cancel-in-progress: false

jobs:
  card-art:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The environment limits the Steam login to the branches its protection rule names.
    environment: steam
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: bazaarplusplus-mod/global.json
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.58.0
      # Only the two Steam steps read the login (ADR 0015).
      - name: Compare Steam and GameData with the published set
        id: stale
        env:
          STEAM_SNAPSHOT_LOGIN: ${{ secrets.STEAM_SNAPSHOT_LOGIN }}
        run: |
          status=$(curl -sS -w '%{http_code}' https://cdn.bazaarplusplus.com/card-art/index.json -o "$RUNNER_TEMP/previous.json")
          case "$status" in
            200) ;;
            404) rm "$RUNNER_TEMP/previous.json" ;;
            *) echo "Previous Card Art index returned HTTP $status" >&2; exit 1 ;;
          esac
          state="$(just release::card-art stale "$RUNNER_TEMP/previous.json" | tail -n 1)"
          echo "stale=$(jq -r .stale <<< "$state")" >> "$GITHUB_OUTPUT"
          echo "Card Art source: $state" >> "$GITHUB_STEP_SUMMARY"
      - name: Download the art bundles and GameData
        id: download
        if: steps.stale.outputs.stale == 'true'
        env:
          STEAM_SNAPSHOT_LOGIN: ${{ secrets.STEAM_SNAPSHOT_LOGIN }}
        run: |
          source="$(just release::card-art download "$RUNNER_TEMP/game" | tail -n 1)"
          echo "buildid=$(jq -r .buildid <<< "$source")" >> "$GITHUB_OUTPUT"
          echo "zh=$(jq -r .zh <<< "$source")" >> "$GITHUB_OUTPUT"
          echo "gamedata=$(jq -r .gameData <<< "$source")" >> "$GITHUB_OUTPUT"
      - name: Install the repository Rust toolchain
        if: steps.stale.outputs.stale == 'true'
        working-directory: bazaarplusplus-installer
        run: rustc --version
      - name: Restore Card Catalog Rust cache
        if: steps.stale.outputs.stale == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: bazaarplusplus-installer/src-tauri
          shared-key: card-art-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bazaarplusplus-installer/rust-toolchain.toml', 'bazaarplusplus-installer/src-tauri/Cargo.lock', 'bazaarplusplus-installer/src-tauri/.cargo/config.toml') }}
          cache-bin: false
      - name: Extract
        if: steps.stale.outputs.stale == 'true'
        env:
          BUILDID: ${{ steps.download.outputs.buildid }}
          ZH: ${{ steps.download.outputs.zh }}
          GAMEDATA: ${{ steps.download.outputs.gamedata }}
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/previous.json" ]; then previous=(--previous "$RUNNER_TEMP/previous.json"); fi
          if [ -f "$RUNNER_TEMP/previous.json" ] && jq -e '.version >= 2' "$RUNNER_TEMP/previous.json" >/dev/null; then
            for locale in en zh; do
              file=$(jq -r --arg locale "$locale" '.text[$locale] // empty' "$RUNNER_TEMP/previous.json")
              if [ -z "$file" ]; then continue; fi
              [[ "$file" =~ ^text-${locale}-[0-9a-f]{20}\.json$ ]]
              curl -fsS "https://cdn.bazaarplusplus.com/card-art/$file" -o "$RUNNER_TEMP/$file"
            done
          fi
          just installer::card-art "$RUNNER_TEMP/game" "$RUNNER_TEMP/card-art" --require-fx --buildid "$BUILDID" --gamedata-etag "$GAMEDATA" --zh-etag "$ZH" "${previous[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: steps.stale.outputs.stale == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: just release::card-art publish "$RUNNER_TEMP/card-art" | tee -a "$GITHUB_STEP_SUMMARY"
