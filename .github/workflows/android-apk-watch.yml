name: Android APK watch

# Watches the publisher's official Android APK. When it no longer matches the
# android-online entry of the Snapshot Lock, captures it as the new entry
# (ADR 0008) and publishes the inputs to the private bucket. When only the
# game's content changed (same libil2cpp.so and global-metadata.dat), it opens
# a pull request with the lock alone. When the game code changed, it checks
# that the Android Mod still builds against the new interop and opens a pull
# request with the lock alone; a release that bumps VERSION in its own pull
# request adapts the Android App to the new game (docs/release.md "Android
# 发布顺序", ADR 0016). Once the lock or its open pull request records the
# official APK, it writes the public Android Game Status.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Download and compare the official APK even when its size and ETag match the lock
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-apk-watch
  cancel-in-progress: false

jobs:
  # Runs the Patcher and Cpp2IL on the publisher's APK, so it reads only the
  # repository-scope R2 token and never the release environment, which holds
  # the Android release key.
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      # The release modules this job runs import only node built-ins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      # Size and ETag only: the hourly check never downloads 2.8 GB.
      - name: Compare the official APK with the locked one
        id: compare
        env:
          FORCE: ${{ inputs.force == true }}
        run: |
          state="$(bun release/game-libs.ts official-apk)"
          if [[ "$FORCE" == true ]]; then state=changed; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Official APK: $state (force: $FORCE)" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.compare.outputs.state == 'changed'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: bazaarplusplus-mod/global.json
          cache: true
          cache-dependency-path: bazaarplusplus-mod/**/packages.lock.json
      - if: steps.compare.outputs.state == 'changed'
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.58.0
      # Keeps the ETag the bytes came with; the lock records its value.
      - if: steps.compare.outputs.state == 'changed'
        name: Download the official APK
        id: download
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          url="$(bun -e "import { OFFICIAL_ANDROID_APK_URL } from './release/official-apk.ts'; console.log(OFFICIAL_ANDROID_APK_URL)")"
          curl --fail --location --retry 5 --retry-all-errors --dump-header "$RUNNER_TEMP/apk.headers" --output "$RUNNER_TEMP/TheBazaar.apk" "$url"
          etag="$(bun -e "
            import fs from 'node:fs';
            import { strongEtag } from './release/official-apk.ts';
            const lines = fs.readFileSync(process.argv[1], 'utf8').split(/\r?\n/);
            const header = lines.filter((line) => /^etag:/i.test(line)).at(-1);
            console.log(strongEtag(header?.slice(5)) ?? '');
          " "$RUNNER_TEMP/apk.headers")"
          sha="$(sha256sum "$RUNNER_TEMP/TheBazaar.apk" | cut -d' ' -f1)"
          locked="$(bun -p "require('./bazaarplusplus-mod/build/game-libs.lock.json').entries['android-online'].apkSha256")"
          lockedEtag="$(bun -p "require('./bazaarplusplus-mod/build/game-libs.lock.json').entries['android-online'].apkEtag ?? ''")"
          code="$(bun -p "require('./bazaarplusplus-mod/build/game-libs.lock.json').entries['android-online'].versionCode")"
          echo "etag=$etag" >> "$GITHUB_OUTPUT"
          echo "Downloaded $(stat -c %s "$RUNNER_TEMP/TheBazaar.apk") bytes, sha256 $sha, ETag ${etag:-none}; locked sha256 $locked, ETag ${lockedEtag:-none}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$sha" != "$locked" ]]; then
            echo "kind=capture" >> "$GITHUB_OUTPUT"
          elif [[ -n "$etag" && "$etag" != "$lockedEtag" ]]; then
            # The locked bytes under a new ETag: record it, or every check downloads again.
            branch="chore/android-apk-etag-$code-${etag:0:8}"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              echo "kind=none" >> "$GITHUB_OUTPUT"
              echo "A pull request recording this ETag is already open" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "kind=etag" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "The official APK is the locked one" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.download.outputs.kind == 'etag'
        name: Record the ETag of the locked APK
        env:
          GH_TOKEN: ${{ github.token }}
          ETAG: ${{ steps.download.outputs.etag }}
          BRANCH: ${{ steps.download.outputs.branch }}
        run: |
          bun release/game-libs.ts record-apk-etag --apk "$RUNNER_TEMP/TheBazaar.apk" --apk-etag "$ETAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add bazaarplusplus-mod/build/game-libs.lock.json
          git commit -m "chore(mod): record the official Android APK's ETag"
          git push origin "$BRANCH"
          printf '%s\n' \
            "The publisher serves the locked APK (same sha256) under ETag \`$ETAG\`. Recording it keeps the hourly check from downloading it again." \
            '' \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '' \
            'Release Notes:' \
            '' \
            '- N/A' > "$RUNNER_TEMP/body.md"
          gh pr create --base master --head "$BRANCH" --title "chore(mod): record the official Android APK's ETag" --body-file "$RUNNER_TEMP/body.md"
      # Captures on Linux x64, where the Patcher generates the interop, with the
      # locked toolchain; the lock is written last. change is content when the
      # game code is the locked one and code otherwise
      # (release/android-adaptation.ts captureKind).
      - if: steps.download.outputs.kind == 'capture'
        name: Capture the new android-online entry
        id: capture
        env:
          ETAG: ${{ steps.download.outputs.etag }}
        run: |
          cp bazaarplusplus-mod/build/game-libs.lock.json "$RUNNER_TEMP/previous-lock.json"
          just mod::snapshot-android "$RUNNER_TEMP/TheBazaar.apk" ${ETAG:+--apk-etag "$ETAG"}
          change="$(bun release/android-adaptation.ts kind --previous "$RUNNER_TEMP/previous-lock.json")"
          case "$change" in
            content | code) ;;
            *)
              echo "::error::The capture is $change, not content or code"
              exit 1
              ;;
          esac
          game="$(bun -p "require('./bazaarplusplus-mod/build/game-libs.lock.json').entries['android-online'].gameVersion")"
          code="$(bun -p "require('./bazaarplusplus-mod/build/game-libs.lock.json').entries['android-online'].versionCode")"
          echo "game=$game" >> "$GITHUB_OUTPUT"
          echo "change=$change" >> "$GITHUB_OUTPUT"
          echo "branch=chore/android-online-$code" >> "$GITHUB_OUTPUT"
          echo "Captured $game: $change change" >> "$GITHUB_STEP_SUMMARY"
          if git ls-remote --exit-code --heads origin "chore/android-online-$code" > /dev/null; then
            fresh=false
            echo "A pull request for $game is already open" >> "$GITHUB_STEP_SUMMARY"
          else
            fresh=true
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
      # Content-only too: the hourly comparison reads the locked APK's size from
      # the private bucket, and the lock must stay fetchable from it alone.
      - if: steps.capture.outputs.fresh == 'true'
        name: Publish the captured inputs
        run: just mod::publish android online
      # The pull request below is opened with GITHUB_TOKEN, which starts no
      # checks, so the Android lane runs here and its result goes in the body.
      # A content-only change keeps the locked interop (captureKind checks it),
      # so the Android Mod builds from the same inputs as on master.
      - if: steps.capture.outputs.fresh == 'true' && steps.capture.outputs.change == 'code'
        name: Check the Android Mod against the new interop
        id: verify
        continue-on-error: true
        run: just verify mod::android-build mod::test-core
      - if: steps.capture.outputs.fresh == 'true' && steps.capture.outputs.change == 'content'
        name: Open the content-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GAME: ${{ steps.capture.outputs.game }}
          BRANCH: ${{ steps.capture.outputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add bazaarplusplus-mod/build/game-libs.lock.json
          git commit -m "chore(mod): record Android game $GAME"
          git push origin "$BRANCH"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The publisher's official APK is now $GAME. Its game code (libil2cpp.so and global-metadata.dat) and its Interop Snapshot are the locked ones, so this records it as the android-online entry of the Snapshot Lock (inputs published to the private bucket) without a new adaptation and without a VERSION change. The released Android App keeps running BazaarPlusPlus on it, because it compares the game code only (docs/adr/0012-android-app.md).

          - The Android Mod builds from the same interop as on master, so this run did not build it again.
          - Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Release Notes:

          - N/A
          EOF
          gh pr create --base master --head "$BRANCH" --title "chore(mod): record Android game $GAME" --body-file "$RUNNER_TEMP/body.md"
      - if: steps.capture.outputs.fresh == 'true' && steps.capture.outputs.change == 'code'
        name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GAME: ${{ steps.capture.outputs.game }}
          BRANCH: ${{ steps.capture.outputs.branch }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add bazaarplusplus-mod/build/game-libs.lock.json
          git commit -m "chore(mod): capture Android game $GAME"
          git push origin "$BRANCH"
          if [[ "$VERIFY" == success ]]; then
            check='`just verify mod::android-build mod::test-core` passed against the new interop.'
          else
            check='`just verify mod::android-build mod::test-core` **failed** against the new interop; see the workflow run.'
          fi
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The publisher's official APK is now $GAME. This captures it as the android-online entry of the Snapshot Lock (inputs published to the private bucket), without a VERSION change. Until a release adapts the Android App to it, the download page shows the Android game as not adapted.

          - $check
          - Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - To release it, bump VERSION in a separate pull request, then run release.yml with that version and \`just release::promote --platform android\` (docs/release.md "Android 发布顺序").

          Release Notes:

          - Improved: Android supports game $GAME.
          EOF
          gh pr create --base master --head "$BRANCH" --title "chore(mod): capture Android game $GAME" --body-file "$RUNNER_TEMP/body.md"
      # The lock on master records the official APK (unchanged, or the same
      # bytes under a new ETag), or the capture above recorded it for the lock
      # pull request, open or just opened. The download page compares it with
      # the Android Platform Release Manifest's game.
      - if: >-
          steps.compare.outputs.state == 'unchanged' ||
          steps.download.outputs.kind == 'none' ||
          steps.download.outputs.kind == 'etag' ||
          steps.capture.conclusion == 'success'
        name: Write the Android Game Status
        run: bun release/game-libs.ts android-game-status
