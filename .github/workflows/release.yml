name: Release

# One Product Release build per platform on hosted runners: release::prepare,
# release::build and release::upload, in one job so build and upload share a
# host and the Payload lock (docs/release.md, docs/adr/0004-pinned-game-assembly-snapshots.md).
# Android runs on ubuntu-latest: it injects the official APK from the private
# store with the pinned LemonLoader Patcher (Linux x64), signs it with the
# Android release keystore (docs/adr/0009-android-release-key.md) and streams
# the APK and the Managed Payload zip to R2 (ADR 0010).
# promote is not here: the Mainland Mirror is uploaded to Lanzou by hand and
# recorded with mirror-all before promote, so promote stays a local command.
# Signing secrets and variables live in the `release` GitHub Environment; the
# repository variable CLOUDFLARE_ACCOUNT_ID and the repository secret
# CLOUDFLARE_API_TOKEN (the operator token) are shared with other workflows;
# release/github-secrets.json names every one, its scope and its local source,
# and .github/scripts/release-secrets.sh checks them from that table. The R2
# S3 pair is derived from CLOUDFLARE_API_TOKEN (release/r2-store.mjs).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version to build; must equal the VERSION file at the chosen ref
        type: string
        required: true
      dry_run:
        description: Stop after release::prepare; needs only the snapshot store secrets
        type: boolean
        default: false
      platform:
        description: Platform to build; both is the desktop pair, android ships on the game's APK cadence
        type: choice
        options: [both, macos, windows, android]
        default: both
      build_only:
        description: Build signed installers (android; a freshly injected APK) as Actions artifacts without uploading immutable release artifacts to R2
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  platform:
    name: Release ${{ matrix.platform }}
    # Icon Composer sources require the Xcode toolchain on the newer macOS image.
    runs-on: ${{ matrix.platform == 'macos' && 'macos-26' || matrix.platform == 'android' && 'ubuntu-latest' || 'windows-latest' }}
    # The Android job injects and streams a 2.8 GB APK; desktop keeps its limit.
    timeout-minutes: ${{ matrix.platform == 'android' && 180 || 120 }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'macos' && '["macos"]' || inputs.platform == 'windows' && '["windows"]' || inputs.platform == 'android' && '["android"]' || '["macos","windows"]') }}
    defaults:
      run:
        shell: bash
    env:
      # Not PLATFORM: MSBuild reads environment variables as properties, and Platform=android
      # moves every project output to bin/android/, where the Android Payload never looks.
      RELEASE_PLATFORM: ${{ matrix.platform }}
      # prepare: a dry run stops after release::prepare; release: build and upload too.
      STAGE: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) && 'prepare' || 'release' }}
      REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails before any toolchain is installed, naming each missing secret.
      - name: Require the release secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash .github/scripts/release-secrets.sh check "$RELEASE_PLATFORM" "$STAGE"
      # A version names one commit (ADR 0001); the run builds the ref it was
      # dispatched from or the tagged commit, so the ask must match that ref.
      - name: Require the requested version to equal VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          requested="${REQUESTED_VERSION#v}"
          if [[ "$requested" != "$version" ]]; then
            echo "::error title=Version mismatch::Requested $requested, but VERSION at $GITHUB_SHA is $version. Dispatch from the commit that sets VERSION, or tag v$version on it."
            exit 1
          fi
          echo "Building $RELEASE_PLATFORM $version from $GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bazaarplusplus-installer/package-lock.json
      - name: Compile the macOS Icon Composer asset
        if: matrix.platform == 'macos' && env.STAGE == 'release'
        run: |
          xcodebuild -version
          node bazaarplusplus-installer/scripts/release/compile-macos-icon.mjs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: bazaarplusplus-mod/global.json
          cache: true
          cache-dependency-path: bazaarplusplus-mod/**/packages.lock.json
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.58.0
      - name: Install the repository Rust toolchain and components
        if: matrix.platform != 'android'
        working-directory: bazaarplusplus-installer
        run: |
          rustc --version
          rustup show active-toolchain
      - run: npm install --global "$(node --print "require('./package.json').packageManager")"
      # The Managed Payload zip is signed with the installer's pinned Tauri CLI,
      # and the input, intermediate and output APKs need about 9 GB at once
      # (docs/release.md); free the toolchains this job does not use.
      - if: matrix.platform == 'android'
        name: Install the Tauri CLI and free runner disk for the APK
        run: |
          npm ci --prefix bazaarplusplus-installer
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"
      - run: just release::check
      # The product compiles against this platform's online Snapshot Lock entry;
      # a null entry fails here, naming the snapshot to capture. The operator
      # token reads the private store for this step only.
      - name: Fetch the online Game Assembly Snapshot (android, the Interop Snapshot)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: just mod::fetch "$RELEASE_PLATFORM" online
      # prepare reuses the committed native recorder inputs when
      # release/native-recorder-input.mjs finds them fresh and rebuilds them on
      # this runner otherwise; a rebuild changes tracked files, which the next
      # step turns into a named failure instead of an unpublishable dirty build.
      - name: Prepare the Payload
        run: |
          just release::prepare "$RELEASE_PLATFORM" | tee "$RUNNER_TEMP/prepare.log"
          grep -E '^Prepared ' "$RUNNER_TEMP/prepare.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Require prepare to leave tracked files unchanged
        id: clean
        run: |
          changes="$(git status --porcelain --untracked-files=no)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            git diff --binary > "$RUNNER_TEMP/native-recorder-inputs.patch"
            echo "::error title=Native recorder inputs rebuilt::release::prepare rebuilt the $RELEASE_PLATFORM native recorder inputs and changed the tracked files above. Apply the native-recorder-inputs-$RELEASE_PLATFORM artifact with 'git apply', or run 'just release::prepare $RELEASE_PLATFORM' locally, commit, and rerun."
            exit 1
          fi
      - if: failure() && steps.clean.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-recorder-inputs-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-recorder-inputs.patch
          retention-days: 7
      - if: env.STAGE == 'prepare'
        run: echo "Dry run stopped after release::prepare for $RELEASE_PLATFORM; nothing was signed or uploaded." >> "$GITHUB_STEP_SUMMARY"
      # bundle.sh reads signing material as files from BPP_SIGNING_SECRETS_DIR,
      # the same layout `node scripts/workspace.mjs run signing` stages locally.
      - if: env.STAGE == 'release'
        name: Stage the signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          bash .github/scripts/release-secrets.sh stage "$RELEASE_PLATFORM" "$RUNNER_TEMP/signing-secrets"
          echo "BPP_SIGNING_SECRETS_DIR=$RUNNER_TEMP/signing-secrets" >> "$GITHUB_ENV"
      # bundle.sh codesigns nested resources before Tauri bundles, so the
      # Developer ID identity must already be in a keychain; Tauri then finds the
      # same identity through APPLE_SIGNING_IDENTITY and notarizes with the API key.
      - if: env.STAGE == 'release' && matrix.platform == 'macos'
        name: Import the Developer ID certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$keychain" | grep -Fq "$APPLE_SIGNING_IDENTITY"; then
            echo "::error title=Signing identity not found::APPLE_CERTIFICATE does not contain the identity named by APPLE_SIGNING_IDENTITY; export the Developer ID Application certificate with its private key as .p12 and set both secrets."
            security find-identity -v -p codesigning "$keychain" || true
            exit 1
          fi
          echo "BPP_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - if: env.STAGE == 'release' && matrix.platform != 'android'
        name: Build and sign the installer
        run: just release::build "$RELEASE_PLATFORM"
      # Android build reads the release store (is this APK identity published?)
      # and the private snapshot store (the official APK, Loader Release and
      # Patcher). build_only always injects, so the run keeps an APK to install.
      - if: env.STAGE == 'release' && matrix.platform == 'android'
        name: Build the Managed Payload zip and the Android Release APK
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_ONLY: ${{ inputs.build_only == true }}
        run: |
          if [[ "$BUILD_ONLY" == true ]]; then
            node release.mjs build --platform android --rebuild-apk
          else
            just release::build android
          fi
          # The official APK copy is no longer needed; upload streams the outputs.
          rm -rf bazaarplusplus-mod/game-libs/inputs
          df -h "$GITHUB_WORKSPACE"
      - if: env.STAGE == 'release' && inputs.build_only != true
        name: Upload the immutable platform artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          just release::upload "$RELEASE_PLATFORM" | tee "$RUNNER_TEMP/upload.log"
          grep -E '^Uploaded ' "$RUNNER_TEMP/upload.log" >> "$GITHUB_STEP_SUMMARY" || true
      # The installer and its artifact manifest, for inspection; R2 holds the
      # copy promote reads.
      - if: env.STAGE == 'release' && matrix.platform != 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: |
            bazaarplusplus-installer/src-tauri/target/release-artifacts/${{ matrix.platform }}.json
            bazaarplusplus-installer/src-tauri/target/release/bundle/nsis/*
            bazaarplusplus-installer/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*
            bazaarplusplus-installer/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz*
          if-no-files-found: error
          retention-days: 14
      # The build receipt and Managed Payload zip always; the APK only for
      # build_only, to install on a clean AVD (an uploaded APK is on R2).
      - if: env.STAGE == 'release' && matrix.platform == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: |
            target/android/android-aarch64.json
            target/android/*.zip
            target/android/*.zip.sig
            ${{ inputs.build_only == true && 'target/android/*.apk' || '' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - if: always() && matrix.platform == 'android'
        name: Remove the Android intermediates
        run: rm -rf target/android bazaarplusplus-mod/game-libs/inputs
      - if: always()
        name: Remove the staged secrets and the temporary keychain
        run: |
          rm -rf "$RUNNER_TEMP/signing-secrets"
          if [[ -n "${BPP_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$BPP_RELEASE_KEYCHAIN" || true
          fi
