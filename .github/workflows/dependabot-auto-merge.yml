name: Operations / Dependabot auto-merge

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    # Narrow trigger to dependency/action manifests to avoid skipped-run noise on ordinary PRs.
    paths:
      - '**/package.json'
      - '**/bun.lock'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/Directory.Packages.props'
      - '**/*.csproj'
      - '**/packages.lock.json'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/*.gradle*'

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Privileged workflow: never check out, install or execute the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = await import('${{ github.workspace }}/.github/scripts/dependabot-auto-merge.ts');
            await run({ github, context, core });
