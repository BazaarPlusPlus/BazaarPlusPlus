# Temporary #230 measurement harness; removed before merge.
name: Installer cache experiment
on:
  push:
    branches: [codex/installer-ci-cache]
    paths: [.github/workflows/installer-cache-experiment.yml]
permissions:
  contents: read
jobs:
  installer:
    name: Installer (${{ matrix.os }} / ${{ matrix.drive }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            drive: default
          - os: windows-latest
            drive: default
          - os: windows-latest
            drive: dev-drive
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bazaarplusplus-installer/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Set up experimental Dev Drive
        if: matrix.drive == 'dev-drive'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4
        with:
          drive-size: 10GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
      - name: Install the repository Rust toolchain and components
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}/bazaarplusplus-installer
        run: |
          rustc --version
          rustup show active-toolchain
      - name: Restore Installer Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}/bazaarplusplus-installer/src-tauri
          # Include these in the prefix so even fallback restores cannot cross
          # toolchain, lockfile or build-configuration changes.
          prefix-key: bpp230-experiment
          key: ${{ matrix.drive }}-installer-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('bazaarplusplus-installer/rust-toolchain.toml', 'bazaarplusplus-installer/src-tauri/Cargo.lock', 'bazaarplusplus-installer/src-tauri/.cargo/config.toml') }}
          cache-bin: false
          save-if: true
      - run: npm install --global "$(node --print "require('./package.json').packageManager")"
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}/bazaarplusplus-installer
      - name: Install Installer npm dependencies
        run: npm ci
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}/bazaarplusplus-installer
      # Includes Rust/JS tests, binding freshness and frontend build. The source
      # gate supplies an empty resource bundle; game assemblies are not required.
      - name: Verify Installer
        run: just installer::check
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}

  installer-timings:
    name: Installer timing report
    needs: installer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Post-job cache saves have finished; the Jobs API includes their timing.
      - run: node .github/scripts/installer-timings.mjs
        env:
          GH_TOKEN: ${{ github.token }}
