name: Delivery / Site

# Preview deploys follow master; production deploys only on dispatch and wait
# for the site-production environment approval. The account id and the
# operator token are the repository variable and secret every workflow shares
# (release/github-secrets.json).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: preview
        options: [preview, production]
  push:
    branches: [master]
    paths:
      - bazaarplusplus-site/**
      - design/components/bundle.css
      - design/ui/**
      - design/ui-classes.ts
      - bazaarplusplus-installer/src/styles/tokens.css
      - release/**
      - .github/workflows/deploy-site.yml

permissions:
  contents: read

concurrency:
  group: deploy-site-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: site-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.58.0
      - run: bun install --frozen-lockfile
        working-directory: bazaarplusplus-site
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set as a repository secret (just secrets-sync)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set as a repository variable (just secrets-sync)."
            exit 1
          fi
      - run: just site::check site::test
      - name: Deploy with the pinned Wrangler
        id: deploy
        # Explicit bash enables pipefail so a Wrangler failure is not hidden by tee.
        shell: bash
        working-directory: bazaarplusplus-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$TARGET" = production ]; then
            bun run wrangler deploy
            echo 'url=https://bazaarplusplus.com' >> "$GITHUB_OUTPUT"
          else
            bun run wrangler deploy --env preview | tee "$RUNNER_TEMP/deploy.log"
            url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi
