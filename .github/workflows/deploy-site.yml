name: Delivery / Site

# Preview deploys follow master; production deploys only on dispatch and wait
# for the site-production environment approval. The account id and the
# operator token are the repository variable and secret every workflow shares
# (release/github-secrets.json).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: preview
        options: [preview, production]
  push:
    branches: [master]
    paths:
      - bazaarplusplus-site/**
      - '!bazaarplusplus-site/**/*.md'
      - packages/ui/**
      - packages/runs/**
      - release/downloads.ts
      - release/fixtures/latest/**
      - release/fixtures/game-status.json
      - release/fixtures/android-game-status.json
      - .github/workflows/deploy-site.yml

permissions:
  contents: read

concurrency:
  group: deploy-site-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: site-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
      WRANGLER_SEND_METRICS: 'false'
      # The public Turnstile site key of the account forms' widget. Preview and
      # production both reach the production server, which checks the tokens
      # with the widget's secret (server deployment runbook, section 8). The
      # widget must list each host the forms run on.
      VITE_TURNSTILE_SITE_KEY: '0x4AAAAAAGRHdkqh1ZrDnFGC'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.58.0
      - run: bun install --frozen-lockfile
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set as a repository secret (just secrets-sync)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set as a repository variable (just secrets-sync)."
            exit 1
          fi
      - name: Require the Turnstile site key
        run: |
          if [ -z "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "::error::VITE_TURNSTILE_SITE_KEY is empty; a build without it uses Cloudflare's test key, which the production server rejects."
            exit 1
          fi
      # PR checks already ran full site::ci before merge; preview pushes only build.
      - if: github.event_name == 'push'
        run: just site::build
      - if: github.event_name != 'push'
        run: just site::check site::test
      - name: Deploy with the pinned Wrangler
        id: deploy
        # Explicit bash enables pipefail so a Wrangler failure is not hidden by tee.
        shell: bash
        working-directory: bazaarplusplus-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$TARGET" = production ]; then
            bun run wrangler deploy
            echo 'url=https://bazaarplusplus.com' >> "$GITHUB_OUTPUT"
          else
            bun run wrangler deploy --env preview | tee "$RUNNER_TEMP/deploy.log"
            url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi
