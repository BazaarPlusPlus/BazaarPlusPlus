name: tmp card-catalog Linux build
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --locked --release -p card-catalog --manifest-path bazaarplusplus-installer/src-tauri/Cargo.toml && ./bazaarplusplus-installer/src-tauri/target/release/card-catalog || test $? -eq 1
