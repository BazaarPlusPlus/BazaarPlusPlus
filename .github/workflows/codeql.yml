name: Security / CodeQL

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.html'
      - '**/*.htm'
      - '**/package.json'
      - '**/tsconfig*.json'
      - '**/*.py'
      - '**/*.pyi'
      - '**/pyproject.toml'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/**'
      - '.github/scripts/codeql-scope.ts'
      - 'scripts/git-command.ts'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  # Never cancel an in-progress master push scan so sequential merges cannot drop a language's SARIF baseline.
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}

jobs:
  classify:
    name: Classify CodeQL languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      javascript-typescript: ${{ steps.scope.outputs.javascript-typescript }}
      python: ${{ steps.scope.outputs.python }}
      plan: ${{ steps.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: history
        name: Fetch complete history for change detection
        continue-on-error: true
        run: git fetch --no-tags --unshallow origin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - id: scope
        run: bun .github/scripts/codeql-scope.ts classify
        env:
          HISTORY_FETCH_OUTCOME: ${{ steps.history.outcome }}

  javascript-typescript:
    name: CodeQL (javascript-typescript)
    needs: classify
    if: needs.classify.outputs.javascript-typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:javascript-typescript

  python:
    name: CodeQL (python)
    needs: classify
    if: needs.classify.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: python
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:python

  summary:
    name: CodeQL summary
    if: always()
    needs: [classify, javascript-typescript, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun .github/scripts/codeql-scope.ts summary
        env:
          CODEQL_NEEDS: ${{ toJSON(needs) }}
